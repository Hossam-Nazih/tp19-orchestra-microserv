# Step 5: static routing. Renamed from application.yml (step 6) so Spring ignores it.
# To use it again: rename to application.yml and set spring.cloud.discovery.enabled=false
spring:
  cloud:
    gateway:
      routes:
        - id: r1
          uri: "http://localhost:8088"
          predicates:
            - Path=/clients/**
        - id: r2
          uri: "http://localhost:8088"
          predicates:
            - Path=/client/**
        - id: r3
          uri: "http://localhost:8089"
          predicates:
            - Path=/voitures/**
